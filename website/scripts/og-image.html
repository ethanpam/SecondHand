<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SecondHand social preview</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2')
          format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        padding: 48px 64px;
        background:
          radial-gradient(
            ellipse at 110% -10%,
            #8bb89a,
            #d7e6cf 18%,
            transparent 52%
          ),
          radial-gradient(ellipse at -10% 110%, #8bb89a, transparent 48%),
          #f8faf7;
        color: #163a2c;
        font-family: 'Geist', sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font:
          600 27px 'Bricolage',
          sans-serif;
        letter-spacing: -1px;
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 30%;
      }
      main {
        text-align: center;
        margin-top: 100px;
      }
      h1 {
        font:
          600 90px/0.98 'Bricolage',
          sans-serif;
        letter-spacing: -4px;
      }
      .caption {
        font-size: 17px;
        margin-top: 64px;
        text-align: center;
        color: #415d4c;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img class="mark" src="../public/brand/secondhand-mascot.png" alt="" />
      SecondHand
    </div>
    <main>
      <h1>A little help.<br />A lot less typing.</h1>
    </main>
    <p class="caption">
      Made for Iowa SNAP. Free for Windows &amp; Mac. No account.
    </p>
  </body>
</html>

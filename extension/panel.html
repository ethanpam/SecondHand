<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title data-i18n="SecondHand · Iowa SNAP assistant"></title>
  <link rel="stylesheet" href="panel.css">
  <script src="strings.js"></script>
  <script src="ai-mapper.js" defer></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <section id="launcher" hidden>
    <div id="widget" class="widget">
      <span class="brand" aria-hidden="true">s.</span>
      <div class="widget-body">
        <div class="widget-row">
          <button id="autofill" class="widget-primary" type="button" data-i18n-title="On Iowa’s verified steps, Autofill continues verified information screens and complete applicant pages, then selects the first suggested home address and continues. Review that address before submitting. Tell Us More and unsupported steps still need your answers and Continue." data-i18n="Autofill"></button>
          <button id="unlock" class="widget-primary" type="button" data-i18n="Unlock SecondHand" hidden></button>
          <button id="stop" class="widget-primary" type="button" data-i18n="Stop" hidden></button>
          <button id="details" class="widget-link" type="button" data-i18n-title="Details" data-i18n="Details"></button>
        </div>
        <div class="widget-row">
          <span id="widget-text" role="status" aria-live="polite" data-i18n="Iowa · uses first home address suggestion"></span>
          <button id="need-you" class="widget-link" type="button" hidden></button>
          <button id="widget-translate" class="widget-link" type="button" hidden></button>
        </div>
      </div>
    </div>
    <button id="pill" class="pill" type="button" data-i18n-title="Nothing to fill on this page. Continue in Iowa’s form." hidden><span class="brand" aria-hidden="true">s.</span></button>
  </section>
  <div id="sidepanel" hidden>
    <header class="panel-header">
      <span class="brand" aria-hidden="true">s.</span>
      <div class="header-copy"><strong data-i18n="SecondHand"></strong><span data-i18n="IOWA SNAP"></span></div>
      <select id="language-picker" aria-label="Language" class="language-picker"><option value="en">English</option><option value="es">Español</option></select>
    </header>
    <main id="panel-body">
      <div class="desktop-row"><span id="desktop-status" data-i18n="Checking SecondHand…"></span><button id="desktop-action" class="text-button" type="button" data-i18n="Unlock" hidden></button></div>
      <button id="frames-enable" class="button primary full" type="button" data-i18n="Also turn on the embedded form" hidden></button>
      <button id="site-enable" class="button primary full" type="button" data-i18n="Turn on SecondHand for this site" hidden></button>
      <p id="iowa-policy" class="status" data-i18n="On Iowa’s verified steps, Autofill continues verified information screens and complete applicant pages, then selects the first suggested home address and continues. Review that address before submitting. Tell Us More and unsupported steps still need your answers and Continue."></p>
      <button id="panel-autofill" class="button primary full" type="button" data-i18n="Autofill this page" disabled></button>
      <div id="status" class="status" role="status" aria-live="polite" data-i18n="Checking the application in your active tab…"></div>
      <button id="site-disable" class="text-button site-off" type="button" data-i18n="Turn off SecondHand for this site" hidden></button>
      <button id="panel-translate" class="button full" style="margin-bottom: 12px; background: transparent; border: 1px solid #c7dfd1;" type="button" hidden></button>
      <div id="translation-error" class="status error" hidden></div>
      <section id="translation-section" class="checklist-section" hidden aria-labelledby="translation-title">
        <div class="fields-heading"><h2 id="translation-title" data-i18n="Language"></h2></div>
        <div id="page-translations" class="page-checklist"></div>
      </section>
      <section id="checklist-section" class="checklist-section" hidden aria-labelledby="checklist-title">
        <div class="fields-heading"><h2 id="checklist-title" data-i18n="On this page"></h2><span id="checklist-summary"></span></div>
        <div id="page-checklist" class="page-checklist"></div>
      </section>
      <footer><p data-i18n="Review every answer. Signatures, consent, and final submission stay with you."></p></footer>
    </main>
  </div>
</body>
</html>

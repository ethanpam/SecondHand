<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SecondHand · Iowa SNAP assistant</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" defer></script>
</head>
<body>
  <section id="launcher" hidden>
    <div id="widget" class="widget">
      <span class="brand" aria-hidden="true">s.</span>
      <div class="widget-body">
        <div class="widget-row">
          <button id="autofill" class="widget-primary" type="button">Autofill</button>
          <button id="unlock" class="widget-primary" type="button" hidden>Unlock SecondHand</button>
          <button id="details" class="widget-link" type="button" title="Open details in Chrome’s side panel">Details</button>
        </div>
        <div class="widget-row">
          <span id="widget-text" role="status" aria-live="polite">Iowa SNAP · ready</span>
          <button id="need-you" class="widget-link" type="button" hidden></button>
        </div>
      </div>
    </div>
    <button id="pill" class="pill" type="button" title="Nothing to fill on this page. Open SecondHand’s side panel." hidden><span class="brand" aria-hidden="true">s.</span></button>
  </section>
  <div id="sidepanel" hidden>
    <header class="panel-header">
      <span class="brand" aria-hidden="true">s.</span>
      <div class="header-copy"><strong>SecondHand</strong><span>IOWA SNAP</span></div>
    </header>
    <main id="panel-body">
      <div class="desktop-row"><span id="desktop-status">Checking SecondHand…</span><button id="desktop-action" class="text-button" type="button" hidden>Unlock</button></div>
      <button id="panel-autofill" class="button primary full" type="button" disabled>Autofill this page</button>
      <div id="status" class="status" role="status" aria-live="polite">Checking the application in your active tab…</div>
      <section id="checklist-section" class="checklist-section" hidden aria-labelledby="checklist-title">
        <div class="fields-heading"><h2 id="checklist-title">On this page</h2><span id="checklist-summary"></span></div>
        <div id="page-checklist" class="page-checklist"></div>
      </section>
      <footer><p>You review and click Continue. SecondHand never submits.</p></footer>
    </main>
  </div>
</body>
</html>

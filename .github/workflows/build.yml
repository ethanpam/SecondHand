name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:native
      - run: npm run extension:zip
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:native
        env:
          SECONDHAND_PACKAGED_EXE: release/win-unpacked/secondHand.exe
      - uses: actions/upload-artifact@v4
        with:
          name: secondHand-windows
          path: |
            release/*.exe
            release/secondHand-extension.zip
          if-no-files-found: error
          retention-days: 14

name: Verify and build
# Pushes to feature branches are covered by their pull request, so only main
# and release tags run on push. This avoids running every job twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same pull request cancels the older run. Runs on main
# and tags always finish so every merged commit and release is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    # Fast feedback before the slower installer jobs: static checks and the
    # unit suite on every Node line the app supports (package.json: >=22.12).
    name: Desktop checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  website:
    name: Download website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  extension:
    name: Chromium extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-extension
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run extension:zip
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:native
        env:
          SECONDHAND_PACKAGED_EXE: release/win-unpacked/secondHand-native.exe
      - uses: actions/upload-artifact@v4
        with:
          name: secondHand-windows
          path: |
            release/*.exe
            release/secondHand-extension.zip
          if-no-files-found: error
          retention-days: 30
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            app: release/mac-arm64/secondHand.app/Contents/MacOS/secondHand
          - arch: x64
            runner: macos-15-intel
            app: release/mac/secondHand.app/Contents/MacOS/secondHand
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:native
      - run: npm run dist:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:native
        env:
          SECONDHAND_PACKAGED_EXE: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: secondHand-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
  release:
    name: Retain tagged installers in a draft prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, website, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Tag must match package.json version')"
      - uses: actions/download-artifact@v4
        with:
          pattern: secondHand-*
          path: downloads
          merge-multiple: true
      - run: node scripts/release-checksums.cjs downloads
      - name: Create durable private release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/secondhand-release-notes.md <<'NOTES'
          Installers for Windows x64, Mac Apple Silicon (arm64), and Mac Intel (x64), with the companion Chrome extension and SHA-256 checksums.

          This early version is not code signed or Apple notarized. The operating system may require an explicit approval to open it. Validate the live Iowa portal before using real applicant information. Review the repository setup instructions and privacy notes.

          This repository is private: these release assets require repository access. Public downloads are managed separately and must not expose the private source repository.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" downloads/* --clobber
          else
            gh release create "$RELEASE_TAG" downloads/* --verify-tag --draft --prerelease --title "secondHand $RELEASE_TAG" --notes-file /tmp/secondhand-release-notes.md
          fi

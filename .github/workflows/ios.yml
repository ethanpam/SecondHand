name: iOS
# Runs only when the iPhone app changes, since macOS runner minutes cost more.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'tests/fixtures/**', 'package-lock.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tests/fixtures/**', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  extension:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The tests load jsdom and shared fixtures from the repository root. Skip
      # install scripts: they only download Electron, which these tests don't use.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: node --test Tests/*.test.js
  simulator:
    name: Native and UI tests (Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
      - name: Pick the newest available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-[0-9]+-[0-9]+"))
             | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]) as $version
             | .value[] | select(.name | startswith("iPhone")) | {version: $version, name, udid}]
            | sort_by(.version) | last | .udid // empty')"
          if [ -z "$udid" ]; then echo "::error::No available iPhone simulator on this runner."; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and run tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild -project SecondHand.xcodeproj -scheme SecondHand \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

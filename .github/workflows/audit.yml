name: Dependency audit
# New advisories are published without any code change, so this also runs
# weekly. Critical advisories fail the run; high ones are reported as warnings
# because some (for example Vite's Windows-only dev server issues) cannot be
# fixed without a major upgrade and do not affect shipped code. Dependabot
# opens the update pull requests.
on:
  push:
    branches: [main]
    paths: ['package-lock.json', 'website/package-lock.json', '.github/workflows/audit.yml']
  pull_request:
    paths: ['package-lock.json', 'website/package-lock.json', '.github/workflows/audit.yml']
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            directory: .
          - project: website
            directory: website
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
      - name: Report high advisories
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit (${{ matrix.project }})::High-severity advisories found. See this step's log for details."
          fi
